<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5f6d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffc371;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#36cfd3;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff5f6d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#05010a;stop-opacity:0.9" />
    </radialGradient>
  </defs>
  <!-- Background with gradient -->
  <rect width="100" height="100" rx="20" fill="url(#grad1)"/>
  <!-- Glow effect -->
  <circle cx="50" cy="50" r="45" fill="url(#glow)"/>
  <!-- "S" letter -->
  <text x="50" y="72" font-family="'Space Grotesk', Arial, sans-serif" font-size="65" font-weight="700" fill="#f8f8ff" text-anchor="middle" stroke="#05010a" stroke-width="1" paint-order="stroke fill">S</text>
</svg>